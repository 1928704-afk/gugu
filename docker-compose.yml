version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: goguma-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-goguma1234}
      MYSQL_DATABASE: gogumadb
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  backend:
    build: .
    container_name: goguma-api
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_NAME: gogumadb
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-goguma1234}

volumes:
  mysql_data:
